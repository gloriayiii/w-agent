name: weekly backup

on:
  schedule:
    - cron: '0 19 * * 0' # Sunday 03:00 Asia/Shanghai
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          node scripts/backup.mjs
          rm .env
      - uses: actions/upload-artifact@v4
        with:
          name: w-agent-backup
          path: backups/
          retention-days: 90
